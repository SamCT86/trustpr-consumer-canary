# First-party, read-only acceptance of the v0.1.2 human Step Summary source candidate.
# This is NOT a v0.1.2 release, independent adoption, or permission to merge.
name: TrustPR human summary canary
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
jobs:
  trustpr:
    if: ${{ github.event.pull_request.base.repo.full_name == 'SamCT86/trustpr-consumer-canary' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect PR facts (source candidate, not released v0.1.2)
        id: receipt
        uses: SamCT86/trustpr-action@a37fa88a23e41139d6fed796827a1ebf4a9a5321
        with:
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
      - name: Keep a copy of the unchanged canonical evidence
        if: ${{ always() && steps.receipt.outputs.receipt-path != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: trustpr-human-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.receipt.outputs.receipt-path }}
            ${{ steps.receipt.outputs.summary-path }}
          retention-days: 7
          if-no-files-found: error
