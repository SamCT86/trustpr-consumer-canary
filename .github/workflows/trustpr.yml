name: TrustPR v0.1.2 owner-only acceptance

# Manual, FIRST-PARTY acceptance only. Never treat this editable pull_request
# YAML as a security boundary against untrusted PR authors.
# Intentionally no job-level `if`: failed identity checks must show RED, not SKIPPED.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  trustpr-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refuse unexpected PR identities (fail RED)
        env:
          ACTOR: ${{ github.actor }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const fail = code => { throw new Error(code); };
          if (process.env.GITHUB_EVENT_NAME !== 'pull_request') fail('PULL_REQUEST_REQUIRED');
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,'utf8'));
          const pr = event.pull_request;
          const name = 'SamCT86/trustpr-consumer-canary';
          const validSha = s => typeof s === 'string' && /^[a-f0-9]{40}$/.test(s);
          if (!['opened','synchronize','reopened','ready_for_review'].includes(event.action)
              || process.env.ACTOR !== 'SamCT86'
              || event.repository?.full_name !== name || event.repository?.private !== false
              || String(event.repository?.id) !== '1414582128'
              || pr?.user?.login !== 'SamCT86'
              || pr?.base?.repo?.full_name !== name || pr?.head?.repo?.full_name !== name
              || pr.base.repo.id !== event.repository.id || pr.head.repo.id !== event.repository.id
              || !Number.isSafeInteger(pr.number) || pr.number < 1
              || !validSha(pr.base.sha) || !validSha(pr.head.sha)
              || pr.changed_files !== 1) fail('UNAUTHORIZED_OR_NON_ONEFILE_PR');
          console.log('OWNER_ONLY_PR_EVENT_VERIFIED', pr.number);
          NODE

      - name: Generate the candidate's real GitHub PR receipt
        id: receipt
        uses: SamCT86/trustpr-action@a37fa88a23e41139d6fed796827a1ebf4a9a5321
        with:
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Checkout pinned verifier source only (never PR head)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: SamCT86/trustpr-action
          ref: a37fa88a23e41139d6fed796827a1ebf4a9a5321
          path: trusted-verifier
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: src
          lfs: false
          submodules: false

      - name: Verify raw event, exact one changed workflow path, receipt and summary
        env:
          RECEIPT_PATH: ${{ steps.receipt.outputs.receipt-path }}
          SUMMARY_PATH: ${{ steps.receipt.outputs.summary-path }}
          RECEIPT_STATUS: ${{ steps.receipt.outputs.receipt-status }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {pathToFileURL} from 'node:url';
          const fail = code => { throw new Error(code); };
          const pin='a37fa88a23e41139d6fed796827a1ebf4a9a5321';
          const repo='SamCT86/trustpr-consumer-canary';
          const expectedPath='.github/workflows/trustpr.yml';
          const trusted=path.join(process.env.GITHUB_WORKSPACE,'trusted-verifier');
          if (execFileSync('/usr/bin/git',['-C',trusted,'rev-parse','HEAD'],{encoding:'utf8',timeout:10000}).trim() !== pin) fail('PIN_MISMATCH');
          const imp = name => import(pathToFileURL(path.join(trusted,'src',name)));
          const {parseStrictJson}=await imp('strict-json.mjs');
          const {verifyReceipt}=await imp('receipt.mjs');
          const {renderTrustPrMarkdown}=await imp('human-renderer.mjs');
          const read=async (file,max) => {
            if (typeof file!=='string'||!file) fail('MISSING_LOCAL_PATH');
            const s=await fs.stat(file);
            if (!s.isFile()||s.size>max) fail('LOCAL_FILE_SIZE');
            const b=await fs.readFile(file);
            if (b.byteLength>max) fail('LOCAL_FILE_SIZE');
            return b;
          };
          const event=parseStrictJson(await read(process.env.GITHUB_EVENT_PATH,8*1024*1024));
          const pr=event.pull_request;
          if (event.repository?.full_name !== repo||event.repository?.private!==false
             || pr?.base?.repo?.full_name!==repo||pr?.head?.repo?.full_name!==repo
             || pr.changed_files!==1)fail('SUBJECT_DRIFT');
          const receiptBytes=await read(process.env.RECEIPT_PATH,8*1024*1024);
          const summaryBytes=await read(process.env.SUMMARY_PATH,65536);
          // Preserve original evidence BEFORE a later oracle/status failure.
          const out=path.join(process.env.RUNNER_TEMP,'trustpr-onefile-consumer');
          await fs.mkdir(out,{recursive:true});
          await fs.writeFile(path.join(out,'receipt.json'),receiptBytes);
          await fs.writeFile(path.join(out,'summary.md'),summaryBytes);
          const receipt=parseStrictJson(receiptBytes);
          const result=verifyReceipt(receipt);
          const core=receipt.core,subject=core.subject;
          if (process.env.RECEIPT_STATUS!=='PARTIAL'||core.validity.status!=='PARTIAL'
              ||result.status!=='INTEGRITY_VALID'||result.authenticity!=='UNAUTHENTICATED'
              ||result.policy_binding!=='POLICY_UNBOUND'||result.merge_authorized!==false
              ||subject.repository_id!==String(event.repository.id)
              ||subject.pull_request_number!==String(pr.number)
              ||subject.base_commit_sha!==pr.base.sha||subject.head_commit_sha!==pr.head.sha
              ||!(/^[a-f0-9]{40}$/).test(subject.merge_base_sha)
              ||core.declared.evidence_source!=='GITHUB_READONLY'
              ||!core.unknowns.some(x=>x.stable_code==='TEST_EXECUTION_NOT_ESTABLISHED')
              ||core.unknowns.some(x=>x.field_or_source_tuple==='git_diff'
                 ||(typeof x.field_or_source_tuple==='string'&&x.field_or_source_tuple.startsWith('["git",'))))fail('RECEIPT_IDENTITY_OR_CAVEAT');
          if (!summaryBytes.equals(Buffer.from(renderTrustPrMarkdown(receipt))))fail('SUMMARY_BYTES_DIFFER');
          const fetchPublic=async (url,max) => {
            const response=await fetch(url,{method:'GET',redirect:'manual',signal:AbortSignal.timeout(20000),headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});
            if (!response.ok||response.url!==url||response.headers.has('link')||!response.body)fail('GITHUB_ORACLE_UNAVAILABLE');
            const reader=response.body.getReader();let size=0;const chunks=[];
            try {
              while (true) {
                const {done,value}=await reader.read();if(done)break;
                size+=value.byteLength;
                if(size>max)fail('GITHUB_ORACLE_SIZE');
                chunks.push(Buffer.from(value));
              }
            } finally { await reader.cancel().catch(()=>{}); }
            return parseStrictJson(Buffer.concat(chunks,size));
          };
          const url=`https://api.github.com/repos/${repo}/pulls/${pr.number}/files?per_page=100`;
          const files=await fetchPublic(url,1024*1024);
          if (!Array.isArray(files)||files.length!==1||files[0].filename!==expectedPath||files[0].status!=='modified'||!/^[a-f0-9]{40}$/.test(files[0].sha))fail('FILE_ORACLE_INVALID');
          const paths=core.observed.changed_entries;
          if (paths.length!==1||Buffer.from(paths[0].raw_path_b64,'base64').toString('utf8')!==expectedPath
              ||paths[0].change_type!=='MODIFY'||paths[0].new_blob_sha!==files[0].sha)fail('GIT_PATH_BLOB_MISMATCH');
          // Re-read original PR after the files oracle: a moving head must fail RED.
          const live=await fetchPublic(`https://api.github.com/repos/${repo}/pulls/${pr.number}`,512*1024);
          if (live.number!==pr.number||live.state!=='open'||live.changed_files!==1
              ||live.head?.sha!==pr.head.sha||live.base?.sha!==pr.base.sha
              ||live.head?.repo?.id!==event.repository.id||live.base?.repo?.id!==event.repository.id
              ||live.head?.repo?.full_name!==repo||live.base?.repo?.full_name!==repo)
            fail('PR_MOVED_AFTER_EVENT');
          await fs.writeFile(path.join(out,'event-identity.json'),JSON.stringify({repository:repo,pr:pr.number,base:pr.base.sha,head:pr.head.sha,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,source_pin:pin},null,2)+'\n');
          await fs.writeFile(path.join(out,'verification.json'),JSON.stringify({result,receipt_status:core.validity.status,core_digest:receipt.integrity.core_digest,changed_file:expectedPath,new_blob_sha:files[0].sha,summary_byte_match:true},null,2)+'\n');
          console.log(JSON.stringify({receipt_status:core.validity.status,verified:result.status,changed_path:expectedPath,core_digest:receipt.integrity.core_digest,source_pin:pin}));
          NODE

      - name: Upload original read-only acceptance evidence
        if: ${{ always() && steps.receipt.outputs.receipt-path != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: trustpr-v012-onefile-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trustpr-onefile-consumer/
          retention-days: 7
          if-no-files-found: error
