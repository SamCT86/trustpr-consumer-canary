name: Public TrustPR consumer canary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  trustpr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate public TrustPR receipt
        id: trustpr
        uses: SamCT86/trustpr-action@95d913eccbce6ccb547c293deaa8711272148e93
        with:
          repository: ${{ github.repository }}
          pull-request-number: ${{ github.event.pull_request.number }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

      # Only the immutable, trusted Action source is checked out. No PR checkout.
      - name: Read pinned receipt verifier
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: SamCT86/trustpr-action
          ref: 95d913eccbce6ccb547c293deaa8711272148e93
          path: trusted-action
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: src
          submodules: false
          lfs: false

      - name: Verify event, receipt, and complete changed paths
        env:
          RECEIPT_PATH: ${{ steps.trustpr.outputs.receipt-path }}
          SUMMARY_PATH: ${{ steps.trustpr.outputs.summary-path }}
          RECEIPT_STATUS: ${{ steps.trustpr.outputs.receipt-status }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {pathToFileURL} from 'node:url';
          import {execFile} from 'node:child_process';
          import {promisify} from 'node:util';
          const fail = code => { throw new Error(code); };
          const actionSha = '95d913eccbce6ccb547c293deaa8711272148e93';
          const repository = 'SamCT86/trustpr-consumer-canary';
          const trusted = path.join(process.env.GITHUB_WORKSPACE, 'trusted-action');
          const {stdout} = await promisify(execFile)('/usr/bin/git', ['-C', trusted, 'rev-parse', 'HEAD'],
            {timeout: 10000, maxBuffer: 1024});
          if (stdout.trim() !== actionSha) fail('TRUSTED_VERIFIER_SHA_MISMATCH');
          const {parseStrictJson} = await import(pathToFileURL(path.join(trusted, 'src/strict-json.mjs')));
          const {verifyReceipt} = await import(pathToFileURL(path.join(trusted, 'src/receipt.mjs')));
          const {renderTrustPrMarkdown} = await import(pathToFileURL(path.join(trusted, 'src/human-renderer.mjs')));
          const boundedRead = async (file, limit) => {
            const stat = await fs.stat(file);
            if (!stat.isFile() || stat.size > limit) fail('LOCAL_EVIDENCE_LIMIT');
            const bytes = await fs.readFile(file);
            if (bytes.length > limit) fail('LOCAL_EVIDENCE_LIMIT');
            return bytes;
          };
          if (process.env.GITHUB_EVENT_NAME !== 'pull_request') fail('REAL_PR_EVENT_REQUIRED');
          const event = parseStrictJson(await boundedRead(process.env.GITHUB_EVENT_PATH, 8 * 1024 * 1024));
          const pr = event.pull_request;
          if (!['opened', 'synchronize', 'reopened', 'ready_for_review'].includes(event.action)
            || event.repository?.full_name !== repository || event.repository?.private !== false
            || pr?.base?.repo?.full_name !== repository || pr?.head?.repo?.full_name !== repository
            || pr.base.repo.id !== event.repository.id || pr.head.repo.id !== event.repository.id
            || !Number.isSafeInteger(pr.number) || pr.number < 1
            || !/^[0-9a-f]{40}$/.test(pr.base.sha) || !/^[0-9a-f]{40}$/.test(pr.head.sha)) {
            fail('CANARY_EVENT_SUBJECT_INVALID');
          }
          const actor = process.env.ACTOR;
          const kind = actor === 'dependabot[bot]' && pr.user?.login === 'dependabot[bot]'
            ? 'dependabot' : actor === 'SamCT86' && pr.user?.login === 'SamCT86' ? 'same-repository' : null;
          if (!kind) fail('CANARY_ACTOR_INVALID');
          const expectedPaths = kind === 'dependabot' ? ['package-lock.json', 'package.json'] : ['.github/workflows/trustpr.yml'];
          if (pr.changed_files !== expectedPaths.length) fail('EVENT_CHANGED_FILE_COUNT_INVALID');
          const identity = {
            schema: 'trustpr-public-consumer-event-v1', event_name: process.env.GITHUB_EVENT_NAME,
            action: event.action, kind, actor, actor_id: process.env.ACTOR_ID,
            triggering_actor: process.env.TRIGGERING_ACTOR,
            sender: {login: event.sender?.login, id: event.sender?.id, type: event.sender?.type},
            pull_request_author: {login: pr.user.login, id: pr.user.id, type: pr.user.type},
            repository: {full_name: event.repository.full_name, id: String(event.repository.id), private: false},
            base: {repository: pr.base.repo.full_name, repository_id: String(pr.base.repo.id), sha: pr.base.sha, ref: pr.base.ref},
            head: {repository: pr.head.repo.full_name, repository_id: String(pr.head.repo.id), sha: pr.head.sha, ref: pr.head.ref},
            pull_request_number: pr.number, pull_request_url: pr.html_url,
            run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT,
            workflow_ref: process.env.GITHUB_WORKFLOW_REF, workflow_sha: process.env.GITHUB_WORKFLOW_SHA,
            action_reference: 'SamCT86/trustpr-action@' + actionSha,
            expected_changed_paths: expectedPaths
          };
          const output = path.join(process.env.RUNNER_TEMP, 'trustpr-consumer-evidence');
          await fs.mkdir(output, {recursive: true});
          await fs.writeFile(path.join(output, 'event-identity.json'), JSON.stringify(identity, null, 2) + '\n');
          const receiptBytes = await boundedRead(process.env.RECEIPT_PATH, 8 * 1024 * 1024);
          const summaryBytes = await boundedRead(process.env.SUMMARY_PATH, 65536);
          await fs.writeFile(path.join(output, 'receipt.json'), receiptBytes);
          await fs.writeFile(path.join(output, 'summary.md'), summaryBytes);
          const receipt = parseStrictJson(receiptBytes);
          const result = verifyReceipt(receipt);
          const subject = receipt.core.subject;
          if (subject.repository_id !== String(event.repository.id) || subject.pull_request_number !== String(pr.number)
            || subject.base_commit_sha !== pr.base.sha || subject.head_commit_sha !== pr.head.sha
            || !/^[0-9a-f]{40}$/.test(subject.merge_base_sha)
            || receipt.core.validity.status !== 'PARTIAL' || process.env.RECEIPT_STATUS !== 'PARTIAL'
            || receipt.core.declared.evidence_source !== 'GITHUB_READONLY'
            || result.status !== 'INTEGRITY_VALID' || result.authenticity !== 'UNAUTHENTICATED'
            || result.policy_binding !== 'POLICY_UNBOUND' || result.merge_authorized !== false
            || !receipt.core.unknowns.some(x => x.stable_code === 'TEST_EXECUTION_NOT_ESTABLISHED')
            || receipt.core.unknowns.some(x => x.field_or_source_tuple === 'git_diff'
              || x.field_or_source_tuple.startsWith('["git",'))) fail('RECEIPT_SUBJECT_OR_DIFF_INVALID');
          if (!summaryBytes.equals(Buffer.from(renderTrustPrMarkdown(receipt)))) fail('SUMMARY_BYTE_MISMATCH');
          // One unauthenticated GET of public PR-files metadata; no PR source is executed.
          const url = 'https://api.github.com/repos/' + repository + '/pulls/' + pr.number + '/files?per_page=100';
          const response = await fetch(url, {method: 'GET', redirect: 'manual', signal: AbortSignal.timeout(20000),
            headers: {Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}});
          if (!response.ok || response.url !== url || response.headers.has('link') || !response.body) {
            fail('PUBLIC_FILES_ORACLE_INCOMPLETE');
          }
          const reader = response.body.getReader();
          const chunks = []; let size = 0;
          try {
            while (true) {
              const {done, value} = await reader.read(); if (done) break;
              size += value.byteLength;
              if (size > 1024 * 1024) fail('PUBLIC_FILES_ORACLE_LIMIT');
              chunks.push(Buffer.from(value));
            }
          } finally { await reader.cancel().catch(() => {}); }
          const files = parseStrictJson(Buffer.concat(chunks, size));
          if (!Array.isArray(files) || files.length !== pr.changed_files || files.length >= 100
            || files.some(f => f.status !== 'modified' || !expectedPaths.includes(f.filename)
              || !/^[0-9a-f]{40}$/.test(f.sha))) fail('PUBLIC_FILES_ORACLE_INVALID');
          const metadataPaths = files.map(f => f.filename).sort();
          const entries = receipt.core.observed.changed_entries;
          const observedPaths = entries.map(e => Buffer.from(e.raw_path_b64, 'base64').toString('utf8')).sort();
          if (JSON.stringify(metadataPaths) !== JSON.stringify(expectedPaths)
            || JSON.stringify(observedPaths) !== JSON.stringify(expectedPaths)
            || entries.some(e => e.change_type !== 'MODIFY' || e.old_mode !== '100644' || e.new_mode !== '100644'
              || e.new_blob_sha !== files.find(f => f.filename === Buffer.from(e.raw_path_b64, 'base64').toString('utf8'))?.sha)) {
            fail('COMPLETE_GIT_DIFF_PATH_ORACLE_MISMATCH');
          }
          await fs.writeFile(path.join(output, 'public-files-metadata.json'), JSON.stringify(files, null, 2) + '\n');
          const verification = {...result, canary_kind: kind, subject,
            receipt_status: receipt.core.validity.status, core_digest: receipt.integrity.core_digest,
            changed_paths: observedPaths, git_diff_complete: true, summary_byte_match: true,
            unknowns: receipt.core.unknowns, public_oracle_requests: 1, verifier_action_sha: actionSha};
          await fs.writeFile(path.join(output, 'verification.json'), JSON.stringify(verification, null, 2) + '\n');
          console.log(JSON.stringify(verification));
          NODE

      # Caller-owned diagnostic uploader; this is not a product permission or feature.
      - name: Save receipt and consumer evidence for independent readback
        if: ${{ always() && steps.trustpr.outputs.receipt-path != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: trustpr-consumer-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trustpr-consumer-evidence/
          retention-days: 7
          if-no-files-found: error
